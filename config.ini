# ==============================================================================
#  CONFIGURACIÓN DE PERSONALIZACIÓN DE FIRMWARE - PANTALLA F133 (10.26")
# ==============================================================================
# Modifica los valores a continuación para personalizar tu pantalla.
# Al guardar este archivo y ejecutar 'python3 cambiar_logo.py', todos estos
# ajustes se aplicarán automáticamente a la imagen final.
# ==============================================================================

[bluetooth]
# Nombre que mostrará la pantalla al buscar dispositivos Bluetooth desde el celular.
# (Recomendado: entre 1 y 8 caracteres para compatibilidad de registro en memoria).
# Ejemplos: MiAuto, CarBT, L200, Hilux, Mustang, BT_CAR, etc.
nombre = L200

[sistema]
# Idioma por defecto al encender la pantalla por primera vez:
#   3 = Español (Recomendado)
#   2 = English
#   0 = Chino Simplificado
#   1 = Chino Tradicional
#   4 = Ruso
#   5 = Francés
#   6 = Alemán
#   7 = Italiano
#   8 = Portugués
#   9 = Polaco
#  10 = Turco
#  18 = Japonés
#  17 = Coreano
idioma = 3

# Texto que aparece en 'Información del Sistema' en la pantalla de Ajustes.
# (Máximo 30 caracteres).
version_texto = DIEGO SAGREDO EDITION 2026

[sonido]
# Comportamiento del sonido de encendido de la pantalla:
#   silencio -> 0dB digital, encendido limpio y silencioso sin pitidos (Recomendado).
#   archivo  -> Usa el archivo de audio 'custom_sound.wav' que coloques en esta carpeta.
modo = silencio

# Nombre del archivo de audio personalizado (solo si modo = archivo).
# Se recomienda un sonido corto de 1 a 4 segundos.
archivo = custom_sound.wav
